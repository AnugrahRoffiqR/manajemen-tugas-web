<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tugas — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Mobile Top Header Bar (< 1024px) -->
  <div id="mobile-header"></div>

  <div class="app-shell">
    <!-- Desktop Sidebar (>= 1024px) -->
    <div id="sidebar-container"></div>

    <main class="workspace-main">

      <header class="page-head">
        <div>
          <h1 class="page-title">Daftar Tugas</h1>
          <p class="page-sub">Kelola siklus pekerjaan tim, ubah status antrean, dan pantau tenggat waktu.</p>
        </div>
        <div class="page-actions">
          <div class="segmented" role="group" aria-label="Tampilan">
            <button type="button" id="view-kanban-btn" data-click="switchView" data-args='["kanban"]' aria-pressed="true">Kanban</button>
            <button type="button" id="view-table-btn" data-click="switchView" data-args='["table"]' aria-pressed="false">Tabel</button>
          </div>
          <button type="button" data-click="openTaskModal" class="btn-primary" aria-keyshortcuts="n">
            Buat Tugas <kbd class="key-hint">N</kbd>
          </button>
        </div>
      </header>

      <!-- Filter Toolbar -->
      <section class="card toolbar" aria-label="Filter tugas">
        <div class="chip-row" role="group" aria-label="Filter cepat">
          <button type="button" class="filter-chip active" id="chip-all" data-click="applyQuickChip" data-args='["all"]' aria-pressed="true">Semua Tugas</button>
          <button type="button" class="filter-chip" id="chip-urgent" data-click="applyQuickChip" data-args='["urgent"]' aria-pressed="false">Prioritas High</button>
          <button type="button" class="filter-chip" id="chip-inprogress" data-click="applyQuickChip" data-args='["inprogress"]' aria-pressed="false">Sedang Berjalan</button>
          <button type="button" class="filter-chip" id="chip-done" data-click="applyQuickChip" data-args='["done"]' aria-pressed="false">Selesai</button>
        </div>

        <div class="toolbar-row">
          <div class="toolbar-search">
            <label for="filter-search" class="sr-only">Cari tugas</label>
            <input type="search" id="filter-search" class="form-input" placeholder="Cari judul atau rincian tugas…" data-input="handleSearch" autocomplete="off">
          </div>

          <div class="toolbar-filters">
            <label for="filter-status" class="sr-only">Status</label>
            <select id="filter-status" class="form-select auto" data-change="loadTasks">
              <option value="Semua">Semua Status</option>
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>

            <label for="filter-priority" class="sr-only">Prioritas</label>
            <select id="filter-priority" class="form-select auto" data-change="loadTasks">
              <option value="Semua">Semua Prioritas</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>

            <label for="filter-category" class="sr-only">Kategori</label>
            <select id="filter-category" class="form-select auto" data-change="loadTasks">
              <option value="Semua">Semua Kategori</option>
              <option value="Operasional">Operasional</option>
              <option value="Teknis">Teknis</option>
              <option value="Administrasi">Administrasi</option>
              <option value="Bisnis">Bisnis</option>
              <option value="Umum">Umum</option>
            </select>

            <button type="button" data-click="resetFilters" class="btn-secondary">Reset</button>
          </div>
        </div>
      </section>

      <!-- VIEW 1: KANBAN BOARD -->
      <div id="kanban-view" class="kanban-grid">
        <section class="kanban-col" aria-labelledby="col-todo-title">
          <div class="kanban-col-head">
            <h2 id="col-todo-title" class="kanban-col-title"><span class="status-dot" style="background: var(--status-todo);" aria-hidden="true"></span>To Do</h2>
            <div class="cell-actions" style="align-items: center;">
              <span id="count-todo" class="badge badge-todo font-mono">0</span>
              <button type="button" data-click="openTaskModal" data-args='["To Do"]' class="btn-action-icon" aria-label="Tambah tugas ke To Do" title="Tambah tugas ke To Do">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
          <div id="col-todo" class="kanban-list"></div>
        </section>

        <section class="kanban-col" aria-labelledby="col-inprogress-title">
          <div class="kanban-col-head">
            <h2 id="col-inprogress-title" class="kanban-col-title"><span class="status-dot" style="background: var(--status-in-progress);" aria-hidden="true"></span>In Progress</h2>
            <div class="cell-actions" style="align-items: center;">
              <span id="count-inprogress" class="badge badge-in-progress font-mono">0</span>
              <button type="button" data-click="openTaskModal" data-args='["In Progress"]' class="btn-action-icon" aria-label="Tambah tugas ke In Progress" title="Tambah tugas ke In Progress">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
          <div id="col-inprogress" class="kanban-list"></div>
        </section>

        <section class="kanban-col" aria-labelledby="col-done-title">
          <div class="kanban-col-head">
            <h2 id="col-done-title" class="kanban-col-title"><span class="status-dot" style="background: var(--status-done);" aria-hidden="true"></span>Done</h2>
            <span id="count-done" class="badge badge-done font-mono">0</span>
          </div>
          <div id="col-done" class="kanban-list"></div>
        </section>
      </div>

      <!-- VIEW 2: TABLE -->
      <section id="table-view" class="card card-pad" style="display: none;" aria-label="Tabel tugas">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="center"><span class="sr-only">Selesai</span></th>
                <th>Judul Tugas</th>
                <th>Kategori</th>
                <th>Prioritas</th>
                <th>Status</th>
                <th>Tenggat Waktu</th>
                <th>Pemilik</th>
                <th class="right"><span class="sr-only">Aksi</span></th>
              </tr>
            </thead>
            <tbody id="task-table-rows">
              <tr><td colspan="8" class="loading-text">Memuat data tugas…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Mobile Bottom Nav (< 1024px) -->
  <div id="mobile-bottom-nav"></div>

  <!-- Modal Buat / Edit Tugas -->
  <div id="task-modal" class="modal-overlay">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title" class="modal-title">Tambah Tugas Baru</h2>
        <button type="button" data-click="closeTaskModal" class="btn-action-icon" aria-label="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="task-form" class="modal-body">
        <input type="hidden" id="edit-task-id" value="">

        <div class="field">
          <label for="task-title" class="field-label">Judul Tugas *</label>
          <input type="text" id="task-title" class="form-input" required maxlength="200">
        </div>

        <div class="field">
          <label for="task-desc" class="field-label">Deskripsi</label>
          <textarea id="task-desc" class="form-textarea" rows="3" maxlength="5000"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-category" class="field-label">Kategori</label>
            <select id="task-category" class="form-select">
              <option value="Operasional">Operasional</option>
              <option value="Teknis">Teknis</option>
              <option value="Administrasi">Administrasi</option>
              <option value="Bisnis">Bisnis</option>
              <option value="Umum" selected>Umum</option>
            </select>
          </div>
          <div class="field">
            <label for="task-priority" class="field-label">Prioritas</label>
            <select id="task-priority" class="form-select">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-status" class="field-label">Status</label>
            <select id="task-status" class="form-select">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="task-due-date" class="field-label">Tenggat Waktu *</label>
            <input type="datetime-local" id="task-due-date" class="form-input" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" data-click="closeTaskModal" class="btn-secondary">Batal</button>
          <button type="submit" id="save-task-btn" class="btn-primary"><span id="save-task-btn-text">Simpan Tugas</span></button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/tasks.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <main class="card auth-card">
    <div class="auth-head">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div>
          <div class="brand-name">Manajemen Tugas</div>
          <div class="brand-sub">Workspace Tim</div>
        </div>
      </div>
      <h1 class="auth-title">Masuk</h1>
      <p class="page-sub">Masuk untuk mengelola workspace tim Anda.</p>
    </div>

    <!-- Error Alert Box -->
    <div id="error-alert" class="alert-error" role="alert" aria-live="polite" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0; margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="error-message"></span>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="field">
        <label for="email" class="field-label">Alamat Email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="nama@perusahaan.com" required autocomplete="email" spellcheck="false">
      </div>

      <div class="field" style="margin-bottom: 1.5rem;">
        <div class="label-row">
          <label for="password" class="field-label">Kata Sandi</label>
          <button type="button" id="toggle-pwd-btn" class="btn-ghost btn-sm" aria-controls="password" aria-pressed="false">Lihat Sandi</button>
        </div>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" id="submit-btn" class="btn-primary btn-block">
        <span id="btn-spinner" class="spinner hidden" aria-hidden="true"></span>
        <span id="btn-text">Masuk ke Sistem</span>
      </button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // Toggle Password Visibility
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    toggleBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      toggleBtn.textContent = show ? 'Sembunyikan' : 'Lihat Sandi';
      toggleBtn.setAttribute('aria-pressed', String(show));
    });

    // Form Submit Listener
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');
    const IDLE_LABEL = 'Masuk ke Sistem';

    // Toggle the submit button between idle and loading (cold DB start can take several seconds)
    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.setAttribute('aria-busy', String(loading));
      btnSpinner.classList.toggle('hidden', !loading);
      btnText.textContent = loading ? 'Memverifikasi…' : IDLE_LABEL;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      setLoading(true);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showToast(data.message || 'Login berhasil! Mengalihkan...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else {
          errorMessage.textContent = data.message || 'Email atau kata sandi tidak sesuai.';
          errorAlert.style.display = 'flex';
          setLoading(false);
        }
      } catch (err) {
        errorMessage.textContent = 'Gagal terhubung ke server backend. Periksa koneksi internet Anda.';
        errorAlert.style.display = 'flex';
        setLoading(false);
      }
    });
  </script>
</body>
</html>

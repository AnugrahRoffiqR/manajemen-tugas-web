<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tugas — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Mobile Top Header Bar (< 1024px) -->
  <div id="mobile-header"></div>

  <div class="app-shell">
    <!-- Desktop Sidebar (>= 1024px) -->
    <div id="sidebar-container"></div>

    <main class="workspace-main">

      <header class="page-head">
        <div>
          <h1 class="page-title">Daftar Tugas</h1>
          <p class="page-sub">Kelola siklus pekerjaan tim, ubah status antrean, dan pantau tenggat waktu.</p>
        </div>
        <div class="page-actions">
          <div class="segmented" role="group" aria-label="Tampilan">
            <button type="button" id="view-kanban-btn" onclick="switchView('kanban')" aria-pressed="true">Kanban</button>
            <button type="button" id="view-table-btn" onclick="switchView('table')" aria-pressed="false">Tabel</button>
          </div>
          <button type="button" onclick="openTaskModal()" class="btn-primary" aria-keyshortcuts="n">
            Buat Tugas <kbd class="key-hint">N</kbd>
          </button>
        </div>
      </header>

      <!-- Filter Toolbar -->
      <section class="card toolbar" aria-label="Filter tugas">
        <div class="chip-row" role="group" aria-label="Filter cepat">
          <button type="button" class="filter-chip active" id="chip-all" onclick="applyQuickChip('all')" aria-pressed="true">Semua Tugas</button>
          <button type="button" class="filter-chip" id="chip-urgent" onclick="applyQuickChip('urgent')" aria-pressed="false">Prioritas High</button>
          <button type="button" class="filter-chip" id="chip-inprogress" onclick="applyQuickChip('inprogress')" aria-pressed="false">Sedang Berjalan</button>
          <button type="button" class="filter-chip" id="chip-done" onclick="applyQuickChip('done')" aria-pressed="false">Selesai</button>
        </div>

        <div class="toolbar-row">
          <div class="toolbar-search">
            <label for="filter-search" class="sr-only">Cari tugas</label>
            <input type="search" id="filter-search" class="form-input" placeholder="Cari judul atau rincian tugas…" oninput="handleSearch()" autocomplete="off">
          </div>

          <div class="toolbar-filters">
            <label for="filter-status" class="sr-only">Status</label>
            <select id="filter-status" class="form-select auto" onchange="loadTasks()">
              <option value="Semua">Semua Status</option>
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>

            <label for="filter-priority" class="sr-only">Prioritas</label>
            <select id="filter-priority" class="form-select auto" onchange="loadTasks()">
              <option value="Semua">Semua Prioritas</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>

            <label for="filter-category" class="sr-only">Kategori</label>
            <select id="filter-category" class="form-select auto" onchange="loadTasks()">
              <option value="Semua">Semua Kategori</option>
              <option value="Operasional">Operasional</option>
              <option value="Teknis">Teknis</option>
              <option value="Administrasi">Administrasi</option>
              <option value="Bisnis">Bisnis</option>
              <option value="Umum">Umum</option>
            </select>

            <button type="button" onclick="resetFilters()" class="btn-secondary">Reset</button>
          </div>
        </div>
      </section>

      <!-- VIEW 1: KANBAN BOARD -->
      <div id="kanban-view" class="kanban-grid">
        <section class="kanban-col" aria-labelledby="col-todo-title">
          <div class="kanban-col-head">
            <h2 id="col-todo-title" class="kanban-col-title"><span class="status-dot" style="background: var(--status-todo);" aria-hidden="true"></span>To Do</h2>
            <div class="cell-actions" style="align-items: center;">
              <span id="count-todo" class="badge badge-todo font-mono">0</span>
              <button type="button" onclick="openTaskModal('To Do')" class="btn-action-icon" aria-label="Tambah tugas ke To Do" title="Tambah tugas ke To Do">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
          <div id="col-todo" class="kanban-list"></div>
        </section>

        <section class="kanban-col" aria-labelledby="col-inprogress-title">
          <div class="kanban-col-head">
            <h2 id="col-inprogress-title" class="kanban-col-title"><span class="status-dot" style="background: var(--status-in-progress);" aria-hidden="true"></span>In Progress</h2>
            <div class="cell-actions" style="align-items: center;">
              <span id="count-inprogress" class="badge badge-in-progress font-mono">0</span>
              <button type="button" onclick="openTaskModal('In Progress')" class="btn-action-icon" aria-label="Tambah tugas ke In Progress" title="Tambah tugas ke In Progress">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
          <div id="col-inprogress" class="kanban-list"></div>
        </section>

        <section class="kanban-col" aria-labelledby="col-done-title">
          <div class="kanban-col-head">
            <h2 id="col-done-title" class="kanban-col-title"><span class="status-dot" style="background: var(--status-done);" aria-hidden="true"></span>Done</h2>
            <span id="count-done" class="badge badge-done font-mono">0</span>
          </div>
          <div id="col-done" class="kanban-list"></div>
        </section>
      </div>

      <!-- VIEW 2: TABLE -->
      <section id="table-view" class="card card-pad" style="display: none;" aria-label="Tabel tugas">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="center"><span class="sr-only">Selesai</span></th>
                <th>Judul Tugas</th>
                <th>Kategori</th>
                <th>Prioritas</th>
                <th>Status</th>
                <th>Tenggat Waktu</th>
                <th>Pemilik</th>
                <th class="right"><span class="sr-only">Aksi</span></th>
              </tr>
            </thead>
            <tbody id="task-table-rows">
              <tr><td colspan="8" class="loading-text">Memuat data tugas…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Mobile Bottom Nav (< 1024px) -->
  <div id="mobile-bottom-nav"></div>

  <!-- Modal Buat / Edit Tugas -->
  <div id="task-modal" class="modal-overlay">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title" class="modal-title">Tambah Tugas Baru</h2>
        <button type="button" onclick="closeTaskModal()" class="btn-action-icon" aria-label="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="task-form" class="modal-body">
        <input type="hidden" id="edit-task-id" value="">

        <div class="field">
          <label for="task-title" class="field-label">Judul Tugas *</label>
          <input type="text" id="task-title" class="form-input" required>
        </div>

        <div class="field">
          <label for="task-desc" class="field-label">Deskripsi</label>
          <textarea id="task-desc" class="form-textarea" rows="3"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-category" class="field-label">Kategori</label>
            <select id="task-category" class="form-select">
              <option value="Operasional">Operasional</option>
              <option value="Teknis">Teknis</option>
              <option value="Administrasi">Administrasi</option>
              <option value="Bisnis">Bisnis</option>
              <option value="Umum" selected>Umum</option>
            </select>
          </div>
          <div class="field">
            <label for="task-priority" class="field-label">Prioritas</label>
            <select id="task-priority" class="form-select">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-status" class="field-label">Status</label>
            <select id="task-status" class="form-select">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="task-due-date" class="field-label">Tenggat Waktu *</label>
            <input type="datetime-local" id="task-due-date" class="form-input" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" onclick="closeTaskModal()" class="btn-secondary">Batal</button>
          <button type="submit" id="save-task-btn" class="btn-primary"><span id="save-task-btn-text">Simpan Tugas</span></button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    initNavigation('tasks');

    let allTasks = [];
    let currentView = 'kanban';

    const ICON = {
      todo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
      progress: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
      done: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
      edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
      trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    };

    const STATUS_BADGE = { 'To Do': 'badge-todo', 'In Progress': 'badge-in-progress', Done: 'badge-done' };

    function switchView(view) {
      currentView = view;
      const isKanban = view === 'kanban';
      document.getElementById('kanban-view').style.display = isKanban ? '' : 'none';
      document.getElementById('table-view').style.display = isKanban ? 'none' : 'block';
      document.getElementById('view-kanban-btn').setAttribute('aria-pressed', String(isKanban));
      document.getElementById('view-table-btn').setAttribute('aria-pressed', String(!isKanban));
    }

    const handleSearch = debounce(() => {
      loadTasks();
    }, 250);

    function setActiveChip(type) {
      document.querySelectorAll('.filter-chip').forEach(c => {
        const on = c.id === `chip-${type}`;
        c.classList.toggle('active', on);
        c.setAttribute('aria-pressed', String(on));
      });
    }

    function applyQuickChip(type) {
      setActiveChip(type);
      const presets = {
        all: ['Semua', 'Semua'],
        urgent: ['Semua', 'High'],
        inprogress: ['In Progress', 'Semua'],
        done: ['Done', 'Semua'],
      };
      const [status, priority] = presets[type] || presets.all;
      document.getElementById('filter-status').value = status;
      document.getElementById('filter-priority').value = priority;
      loadTasks();
    }

    function resetFilters() {
      document.getElementById('filter-search').value = '';
      document.getElementById('filter-status').value = 'Semua';
      document.getElementById('filter-priority').value = 'Semua';
      document.getElementById('filter-category').value = 'Semua';
      setActiveChip('all');
      loadTasks();
    }

    async function loadTasks() {
      const search = document.getElementById('filter-search').value;
      const status = document.getElementById('filter-status').value;
      const priority = document.getElementById('filter-priority').value;
      const category = document.getElementById('filter-category').value;

      const params = new URLSearchParams();
      if (search) params.append('search', search);
      if (status !== 'Semua') params.append('status', status);
      if (priority !== 'Semua') params.append('priority', priority);
      if (category !== 'Semua') params.append('category', category);

      try {
        const res = await apiFetch(`/api/tasks?${params.toString()}`);
        if (res && res.data) {
          allTasks = res.data;
          renderKanban(allTasks);
          renderTable(allTasks);
        }
      } catch (err) {}
    }

    function renderKanban(tasks) {
      const groups = [
        ['To Do', 'col-todo', 'count-todo', 'Tidak ada tugas di antrean'],
        ['In Progress', 'col-inprogress', 'count-inprogress', 'Tidak ada tugas berjalan'],
        ['Done', 'col-done', 'count-done', 'Belum ada tugas selesai'],
      ];
      groups.forEach(([status, colId, countId, emptyText]) => {
        const items = tasks.filter(t => t.status === status);
        document.getElementById(countId).textContent = items.length;
        document.getElementById(colId).innerHTML = items.length
          ? items.map(createKanbanCard).join('')
          : `<div class="empty-state-box compact">${emptyText}</div>`;
      });
    }

    function createKanbanCard(task) {
      const id = Number(task.id);
      const title = escapeHtml(task.title);
      const moveBtn = (status, icon, label, extra = '') =>
        `<button type="button" onclick="updateTaskStatus(${id}, '${status}')" class="btn-action-icon${extra}" aria-label="${label}: ${title}" title="${label}">${icon}</button>`;

      return `
        <article class="kanban-card" data-priority="${escapeHtml(task.priority)}">
          <div class="kanban-card-tags">
            ${priorityBadge(task.priority)}
            ${categoryBadge(task.category)}
          </div>
          <h3 class="kanban-card-title${task.completed ? ' is-complete' : ''}">${title}</h3>
          ${task.description ? `<p class="kanban-card-desc">${escapeHtml(task.description)}</p>` : ''}
          <div class="kanban-card-due">
            <span class="font-mono">${formatDateWIB(task.due_date)}</span>
            ${task.completed ? '' : deadlineBadge(task.due_date)}
          </div>
          <div class="kanban-card-foot">
            <span class="muted" style="font-size: 0.75rem; font-weight: 600;">${escapeHtml(task.assignee_name ? task.assignee_name.split(' ')[0] : '')}</span>
            <div class="kanban-card-actions">
              ${task.status !== 'To Do' ? moveBtn('To Do', ICON.todo, 'Pindah ke To Do') : ''}
              ${task.status !== 'In Progress' ? moveBtn('In Progress', ICON.progress, 'Pindah ke In Progress') : ''}
              ${task.status !== 'Done' ? moveBtn('Done', ICON.done, 'Tandai selesai', ' is-done') : ''}
              <button type="button" onclick="openEditTaskModal(${id})" class="btn-action-icon" aria-label="Edit: ${title}" title="Edit">${ICON.edit}</button>
              <button type="button" onclick="deleteTask(${id})" class="btn-action-icon is-danger" aria-label="Hapus: ${title}" title="Hapus">${ICON.trash}</button>
            </div>
          </div>
        </article>`;
    }

    function renderTable(tasks) {
      const tbody = document.getElementById('task-table-rows');
      if (!tasks.length) {
        tbody.innerHTML = `
          <tr><td colspan="8">
            <div class="empty-state-box">
              <h4>Tidak ada tugas ditemukan</h4>
              <p>Sesuaikan kata kunci pencarian atau reset filter.</p>
              <button type="button" onclick="resetFilters()" class="btn-secondary btn-sm">Reset Filter</button>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = tasks.map(t => {
        const id = Number(t.id);
        const title = escapeHtml(t.title);
        return `
          <tr>
            <td class="center">
              <input type="checkbox" class="table-check" ${t.completed ? 'checked' : ''} aria-label="Tandai selesai: ${title}" onchange="updateTaskStatus(${id}, this.checked ? 'Done' : 'In Progress')">
            </td>
            <td class="cell-title${t.completed ? ' is-complete' : ''}">${title}</td>
            <td>${categoryBadge(t.category)}</td>
            <td>${priorityBadge(t.priority)}</td>
            <td><span class="badge ${STATUS_BADGE[t.status] || 'badge-todo'}">${escapeHtml(t.status)}</span></td>
            <td class="nowrap">
              <span class="font-mono" style="font-size: 0.8125rem;">${formatDateWIB(t.due_date)}</span>
              ${t.completed ? '' : `<div style="margin-top: 4px;">${deadlineBadge(t.due_date)}</div>`}
            </td>
            <td class="muted">${escapeHtml(t.assignee_name || '–')}</td>
            <td class="right">
              <div class="cell-actions">
                <button type="button" onclick="openEditTaskModal(${id})" class="btn-action-icon" aria-label="Edit: ${title}" title="Edit">${ICON.edit}</button>
                <button type="button" onclick="deleteTask(${id})" class="btn-action-icon is-danger" aria-label="Hapus: ${title}" title="Hapus">${ICON.trash}</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function updateTaskStatus(taskId, status) {
      try {
        await apiFetch(`/api/tasks/${taskId}`, {
          method: 'PUT',
          body: JSON.stringify({ status }),
        });
        showToast('Status berhasil diubah!', 'success');
        loadTasks();
      } catch (e) {}
    }

    async function deleteTask(taskId) {
      if (!confirm('Apakah Anda yakin ingin menghapus tugas ini secara permanen?')) return;
      try {
        await apiFetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
        showToast('Tugas berhasil dihapus!', 'info');
        loadTasks();
      } catch (e) {}
    }

    function toLocalInputValue(date) {
      const tzOffset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - tzOffset).toISOString().slice(0, 16);
    }

    function showModal() {
      document.body.classList.add('modal-open');
      document.getElementById('task-modal').classList.add('active');
      document.getElementById('task-title').focus();
    }

    // Modal Create / Edit
    function openTaskModal(defaultStatus = 'To Do') {
      document.getElementById('task-form').reset();
      document.getElementById('edit-task-id').value = '';
      document.getElementById('modal-title').textContent = 'Tambah Tugas Baru';
      document.getElementById('save-task-btn-text').textContent = 'Simpan Tugas';
      document.getElementById('task-status').value = defaultStatus;

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(17, 0, 0, 0);
      document.getElementById('task-due-date').value = toLocalInputValue(tomorrow);

      showModal();
    }
    window.openTaskModal = openTaskModal;

    function openEditTaskModal(id) {
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-task-id').value = task.id;
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-desc').value = task.description || '';
      document.getElementById('task-category').value = task.category;
      document.getElementById('task-priority').value = task.priority;
      document.getElementById('task-status').value = task.status;
      document.getElementById('task-due-date').value = toLocalInputValue(task.due_date ? new Date(task.due_date) : new Date());

      document.getElementById('modal-title').textContent = 'Edit Tugas';
      document.getElementById('save-task-btn-text').textContent = 'Simpan Perubahan';

      showModal();
    }

    function closeTaskModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('task-modal').classList.remove('active');
    }

    // Keyboard shortcut 'N' for new task (Escape is handled globally in navbar.js)
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey
        && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)
        && !document.querySelector('.modal-overlay.active')) {
        e.preventDefault();
        openTaskModal();
      }
    });

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('save-task-btn');
      saveBtn.disabled = true;

      const editId = document.getElementById('edit-task-id').value;
      const payload = {
        title: document.getElementById('task-title').value,
        description: document.getElementById('task-desc').value,
        category: document.getElementById('task-category').value,
        priority: document.getElementById('task-priority').value,
        status: document.getElementById('task-status').value,
        due_date: document.getElementById('task-due-date').value,
      };

      try {
        if (editId) {
          await apiFetch(`/api/tasks/${editId}`, { method: 'PUT', body: JSON.stringify(payload) });
          showToast('Data tugas berhasil diperbarui!', 'success');
        } else {
          await apiFetch('/api/tasks', { method: 'POST', body: JSON.stringify(payload) });
          showToast('Tugas baru berhasil disimpan!', 'success');
        }
        closeTaskModal();
        loadTasks();
      } catch (err) {
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadTasks();
  </script>
</body>
</html>

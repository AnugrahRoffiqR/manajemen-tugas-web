<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Sistem Manajemen Tugas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 1.5rem;">

  <div class="doppelrand-shell" style="width: 100%; max-width: 440px;">
    <div class="doppelrand-core" style="padding: 2.5rem 2rem;">
      
      <!-- Brand Header -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: inline-flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 18px rgba(59, 130, 246, 0.45); margin-bottom: 1rem;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em;">Manajemen Tugas</h1>
        <p style="font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem;">Masuk untuk mengelola workspace tim Anda</p>
      </div>

      <!-- Error Alert Box (web-design-guidelines accessible error) -->
      <div id="error-alert" role="alert" aria-live="polite" style="display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 0.75rem; padding: 0.75rem 1rem; color: #fca5a5; font-size: 0.875rem; margin-bottom: 1.25rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="error-message"></span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div style="margin-bottom: 1.25rem;">
          <label for="email" style="display: block; font-size: 0.8125rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.5rem;">
            Alamat Email
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="admin@manajementugas.local" 
            required
            autocomplete="email"
          >
        </div>

        <div style="margin-bottom: 1.75rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label for="password" style="font-size: 0.8125rem; font-weight: 600; color: #cbd5e1;">
              Kata Sandi
            </label>
            <button 
              type="button" 
              id="toggle-pwd-btn" 
              style="background: none; border: none; color: #60a5fa; font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 4px;"
            >
              Lihat Sandi
            </button>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="submit-btn" class="btn-island" style="width: 100%; justify-content: center;">
          <span id="btn-text">Masuk ke Sistem</span>
          <span class="btn-icon-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </span>
        </button>
      </form>

      <!-- Demo Credentials Helper with 1-Click Autofill -->
      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-hairline); text-align: center;">
        <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.5rem;">Akun Owner Default:</p>
        <button type="button" onclick="autofillDemo()" class="btn-secondary" style="font-size: 0.75rem; padding: 0.375rem 0.75rem; min-height: 34px; width: 100%; justify-content: center; gap: 0.5rem;">
          <span>⚡</span>
          <span>Isi Otomatis Kredensial Owner</span>
        </button>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Autofill demo helper
    function autofillDemo() {
      document.getElementById('email').value = 'admin@manajementugas.local';
      document.getElementById('password').value = 'Admin123!';
      showToast('Kredensial Owner terisi!', 'info');
    }

    // Toggle Password Visibility
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.textContent = 'Sembunyikan';
      } else {
        pwdInput.type = 'password';
        toggleBtn.textContent = 'Lihat Sandi';
      }
    });

    // Form Submit Listener
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      btnText.textContent = 'Memverifikasi...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showToast(data.message || 'Login berhasil! Mengalihkan...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else {
          errorMessage.textContent = data.message || 'Email atau kata sandi tidak sesuai.';
          errorAlert.style.display = 'block';
          submitBtn.disabled = false;
          btnText.textContent = 'Masuk ke Sistem';
        }
      } catch (err) {
        errorMessage.textContent = 'Gagal terhubung ke server backend. Periksa koneksi internet Anda.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        btnText.textContent = 'Masuk ke Sistem';
      }
    });
  </script>
</body>
</html>

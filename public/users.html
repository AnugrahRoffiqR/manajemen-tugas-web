<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Tim — Sistem Manajemen Tugas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Mobile Top Header Bar (< 1024px) -->
  <div id="mobile-header"></div>

  <div style="display: flex; min-height: 100dvh;">
    <!-- Desktop Sidebar (>= 1024px) -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace Area -->
    <main class="workspace-main">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.375rem;">
            <span class="badge" style="background: rgba(0, 128, 255, 0.1); color: var(--primary); border: 1px solid rgba(0, 128, 255, 0.25);">
              KHUSUS OWNER
            </span>
          </div>
          <h1 style="font-size: 1.875rem; font-weight: 800; color: var(--text); letter-spacing: -0.025em;">
            Manajemen Tim & <span class="gradient-text">Hak Akses</span>
          </h1>
          <p style="color: var(--text-muted); font-size: 0.875rem;">Kelola hak akses anggota tim, pendaftaran akun baru, dan kontrol status aktif.</p>
        </div>

        <button onclick="openAddUserModal()" class="btn-island">
          <span>+ Tambah Anggota</span>
          <span class="btn-icon-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </span>
        </button>
      </div>

      <!-- Users Table Container -->
      <div class="glass-card" style="padding: 1.5rem;">
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
              <tr style="border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
                <th style="padding: 0.75rem 1rem;">Pengguna</th>
                <th style="padding: 0.75rem 1rem;">Peran (Role)</th>
                <th style="padding: 0.75rem 1rem;">Status Akun</th>
                <th style="padding: 0.75rem 1rem;">Beban Tugas</th>
                <th style="padding: 0.75rem 1rem;">Tanggal Bergabung</th>
                <th style="padding: 0.75rem 1rem; text-align: right;">Aksi</th>
              </tr>
            </thead>
            <tbody id="users-table-rows">
              <tr>
                <td colspan="6" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.875rem;">
                  Memuat data anggota tim...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Mobile Bottom Nav (< 1024px) -->
  <div id="mobile-bottom-nav"></div>

  <!-- Modal Tambah Pengguna Baru -->
  <div id="add-user-modal" class="modal-overlay">
    <div class="modal-container glass-card" style="background: #ffffff; border: 1px solid var(--border);">
      <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text);">+ Daftarkan Anggota Tim Baru</h3>
        <button onclick="closeAddUserModal()" class="btn-action-icon" style="width: 32px; height: 32px;" aria-label="Tutup modal">✕</button>
      </div>
      <form id="add-user-form" class="modal-body">
        <div style="margin-bottom: 1rem;">
          <label for="new-user-name" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Nama Lengkap *</label>
          <input type="text" id="new-user-name" class="form-input" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="new-user-email" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Alamat Email *</label>
          <input type="email" id="new-user-email" class="form-input" placeholder="budi@perusahaan.com" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="new-user-password" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Kata Sandi Awal *</label>
          <input type="password" id="new-user-password" class="form-input" placeholder="Minimal 6 karakter..." required minlength="6">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="new-user-role" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Peran (Role) *</label>
          <select id="new-user-role" class="form-select">
            <option value="User" selected>User (Anggota Pelaksana)</option>
            <option value="Owner">Owner (Administrator Utama)</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
          <button type="button" onclick="closeAddUserModal()" class="btn-secondary">Batal</button>
          <button type="submit" id="save-user-btn" class="btn-island">
            <span>Daftarkan Anggota</span>
            <span class="btn-icon-pill">✓</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Edit Pengguna -->
  <div id="edit-user-modal" class="modal-overlay">
    <div class="modal-container glass-card" style="background: #ffffff; border: 1px solid var(--border);">
      <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text);">✏️ Edit Data & Akses Pengguna</h3>
        <button onclick="closeEditUserModal()" class="btn-action-icon" style="width: 32px; height: 32px;" aria-label="Tutup modal">✕</button>
      </div>
      <form id="edit-user-form" class="modal-body">
        <input type="hidden" id="edit-user-id" value="">

        <div style="margin-bottom: 1rem;">
          <label for="edit-user-name" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Nama Lengkap *</label>
          <input type="text" id="edit-user-name" class="form-input" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="edit-user-role" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Peran (Role)</label>
          <select id="edit-user-role" class="form-select">
            <option value="User">User (Anggota Pelaksana)</option>
            <option value="Owner">Owner (Administrator Utama)</option>
          </select>
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="edit-user-status" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Status Akun</label>
          <select id="edit-user-status" class="form-select">
            <option value="Active">Active (Dapat Masuk)</option>
            <option value="Inactive">Inactive (Diblokir Masuk)</option>
          </select>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="edit-user-password" style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-bottom: 0.375rem;">Ganti Kata Sandi (Opsional)</label>
          <input type="password" id="edit-user-password" class="form-input" placeholder="Biarkan kosong jika tidak ingin mengubah sandi">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
          <button type="button" onclick="closeEditUserModal()" class="btn-secondary">Batal</button>
          <button type="submit" id="update-user-btn" class="btn-island">
            <span>Simpan Perubahan</span>
            <span class="btn-icon-pill">✓</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    initNavigation('users');

    let allUsersList = [];
    let loggedInUser = null;

    async function loadUsersData() {
      try {
        const meRes = await fetch('/api/auth/me');
        if (meRes.ok) {
          const d = await meRes.json();
          loggedInUser = d.data;
          if (loggedInUser.role !== 'Owner') {
            showToast('Akses ditolak. Halaman ini hanya untuk Owner.', 'error');
            setTimeout(() => window.location.href = '/dashboard', 1000);
            return;
          }
        }

        const res = await apiFetch('/api/users');
        if (res && res.data) {
          allUsersList = res.data;
          renderUsersTable(allUsersList);
        }
      } catch (err) {}
    }

    function renderUsersTable(users) {
      const tbody = document.getElementById('users-table-rows');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2.5rem 1rem; color:var(--text-muted);">Belum ada pengguna tercatat.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => {
        const isSelf = loggedInUser && loggedInUser.id === u.id;
        const isOwner = u.role === 'Owner';
        const roleBadgeBg = isOwner ? 'rgba(0, 128, 255, 0.1)' : 'rgba(100, 116, 139, 0.1)';
        const roleColor = isOwner ? 'var(--primary)' : 'var(--text-muted)';
        const avatarBg = isOwner ? 'linear-gradient(135deg, #0080ff, #8b00ff)' : 'linear-gradient(135deg, #64748b, #475569)';
        const statusColor = u.status === 'Active' ? 'var(--cta)' : '#ef4444';
        const statusBg = u.status === 'Active' ? 'rgba(34, 197, 94, 0.12)' : 'rgba(239, 68, 68, 0.12)';
        const taskPercent = u.total_tasks > 0 ? Math.round((u.completed_tasks / u.total_tasks) * 100) : 0;

        return `
          <tr style="border-bottom: 1px solid var(--border); font-size: 0.875rem;">
            <td style="padding: 1rem;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: ${avatarBg}; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.4);">
                  ${u.name.charAt(0).toUpperCase()}
                </div>
                <div>
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <p style="font-weight: 700; color: var(--text);">${u.name}</p>
                    ${isSelf ? '<span class="badge" style="background: rgba(0, 128, 255, 0.15); color: var(--primary); border: 1px solid rgba(0, 128, 255, 0.3); font-size: 9px; padding: 1px 5px;">ANDA</span>' : ''}
                  </div>
                  <p style="font-size: 0.75rem; color: var(--text-muted);">${u.email}</p>
                </div>
              </div>
            </td>
            <td style="padding: 1rem;">
              <span class="badge" style="background: ${roleBadgeBg}; color: ${roleColor}; border: 1px solid ${roleColor}44;">
                ${u.role}
              </span>
            </td>
            <td style="padding: 1rem;">
              <span class="badge" style="background: ${statusBg}; color: ${statusColor}; border: 1px solid ${statusColor}44; display: inline-flex; align-items: center; gap: 6px;">
                <span style="width: 6px; height: 6px; border-radius: 50%; background: ${statusColor}; display: inline-block;"></span>
                <span>${u.status}</span>
              </span>
            </td>
            <td style="padding: 1rem;">
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <div style="display: flex; justify-content: space-between; font-size: 11px;" class="font-mono">
                  <span style="color: var(--text); font-weight: 600;">${u.completed_tasks}/${u.total_tasks}</span>
                  <span style="color: var(--text-muted);">${taskPercent}%</span>
                </div>
                <div style="width: 90px; height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden;">
                  <div style="width: ${taskPercent}%; height: 100%; background: linear-gradient(90deg, #0080ff, #22c55e); border-radius: 999px; transition: width 400ms ease;"></div>
                </div>
              </div>
            </td>
            <td style="padding: 1rem; color: var(--text-secondary); font-size: 0.8125rem;" class="font-mono">
              ${formatDateWIB(u.created_at)}
            </td>
            <td style="padding: 1rem; text-align: right; white-space: nowrap;">
              <button onclick="openEditUserModal(${u.id})" aria-label="Edit akun pengguna ${u.name}" class="btn-secondary" style="padding: 4px 10px; min-height: 32px; font-size: 12px; margin-right: 4px;">
                Edit
              </button>
              ${!isSelf ? `
              <button onclick="deleteUserAccount(${u.id}, '${u.name}')" aria-label="Hapus akun ${u.name}" class="btn-danger" style="padding: 4px 10px; min-height: 32px; font-size: 12px;">
                Hapus
              </button>` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    // Modal Add
    function openAddUserModal() {
      document.getElementById('add-user-form').reset();
      document.body.classList.add('modal-open');
      document.getElementById('add-user-modal').classList.add('active');
    }

    function closeAddUserModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('add-user-modal').classList.remove('active');
    }

    document.getElementById('add-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('save-user-btn');
      saveBtn.disabled = true;

      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const password = document.getElementById('new-user-password').value;
      const role = document.getElementById('new-user-role').value;

      try {
        await apiFetch('/api/users', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, role }),
        });
        showToast('Akun anggota tim berhasil dibuat!', 'success');
        closeAddUserModal();
        loadUsersData();
      } catch (err) {
      } finally {
        saveBtn.disabled = false;
      }
    });

    // Modal Edit
    function openEditUserModal(id) {
      const user = allUsersList.find(u => u.id === id);
      if (!user) return;

      document.getElementById('edit-user-id').value = user.id;
      document.getElementById('edit-user-name').value = user.name;
      document.getElementById('edit-user-role').value = user.role;
      document.getElementById('edit-user-status').value = user.status;
      document.getElementById('edit-user-password').value = '';

      // Proteksi Self-Lockout di UI
      if (loggedInUser && loggedInUser.id === user.id) {
        document.getElementById('edit-user-role').disabled = true;
        document.getElementById('edit-user-status').disabled = true;
      } else {
        document.getElementById('edit-user-role').disabled = false;
        document.getElementById('edit-user-status').disabled = false;
      }

      document.body.classList.add('modal-open');
      document.getElementById('edit-user-modal').classList.add('active');
    }

    function closeEditUserModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('edit-user-modal').classList.remove('active');
    }

    document.getElementById('edit-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const updateBtn = document.getElementById('update-user-btn');
      updateBtn.disabled = true;

      const id = document.getElementById('edit-user-id').value;
      const name = document.getElementById('edit-user-name').value;
      const role = document.getElementById('edit-user-role').value;
      const status = document.getElementById('edit-user-status').value;
      const password = document.getElementById('edit-user-password').value;

      try {
        await apiFetch(`/api/users/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ name, role, status, password }),
        });
        showToast('Data pengguna berhasil diperbarui!', 'success');
        closeEditUserModal();
        loadUsersData();
      } catch (err) {
      } finally {
        updateBtn.disabled = false;
      }
    });

    async function deleteUserAccount(id, name) {
      if (!confirm(`Hapus akun ${name} secara permanen beserta seluruh tugasnya?`)) return;

      try {
        await apiFetch(`/api/users/${id}`, { method: 'DELETE' });
        showToast('Akun berhasil dihapus.', 'info');
        loadUsersData();
      } catch (err) {}
    }

    loadUsersData();
  </script>
</body>
</html>

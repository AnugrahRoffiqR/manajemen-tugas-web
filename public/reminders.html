<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengingat Deadline — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Mobile Top Header Bar (< 1024px) -->
  <div id="mobile-header"></div>

  <div class="app-shell">
    <!-- Desktop Sidebar (>= 1024px) -->
    <div id="sidebar-container"></div>

    <main class="workspace-main">

      <header class="page-head">
        <div>
          <h1 class="page-title">Pengingat</h1>
          <p class="page-sub">Tugas yang lewat tenggat atau jatuh tempo dalam 24 jam, plus catatan pengingat mandiri.</p>
        </div>
      </header>

      <!-- Section 1: Overdue -->
      <section class="section" aria-labelledby="overdue-title">
        <div class="section-head">
          <div style="display: flex; align-items: center; gap: 0.625rem;">
            <span class="tile tile-rose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
            <h2 id="overdue-title" class="section-title">Lewat Tenggat</h2>
          </div>
          <span id="badge-overdue-count" class="badge badge-overdue font-mono">0</span>
        </div>
        <div id="overdue-list" class="list">
          <p class="loading-text">Memeriksa data…</p>
        </div>
      </section>

      <!-- Section 2: Urgent (< 24h) -->
      <section class="section" aria-labelledby="urgent-title" style="margin-bottom: 2rem;">
        <div class="section-head">
          <div style="display: flex; align-items: center; gap: 0.625rem;">
            <span class="tile tile-peach"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
            <h2 id="urgent-title" class="section-title">Jatuh Tempo &lt; 24 Jam</h2>
          </div>
          <span id="badge-urgent-count" class="badge badge-urgent font-mono">0</span>
        </div>
        <div id="urgent-list" class="list">
          <p class="loading-text">Memeriksa data…</p>
        </div>
      </section>

      <!-- Section 3: Custom Reminders -->
      <section class="card card-pad" aria-labelledby="custom-title">
        <div class="section-head">
          <div>
            <h2 id="custom-title" class="section-title">Pengingat Mandiri</h2>
            <p class="section-sub">Catatan pengingat dengan waktu terjadwal</p>
          </div>
          <button type="button" id="toggle-reminder-form" class="btn-secondary" aria-expanded="false" aria-controls="custom-reminder-form">
            Buat Pengingat
          </button>
        </div>

        <form id="custom-reminder-form" class="subform hidden">
          <div class="field-row" style="align-items: end;">
            <div class="field">
              <label for="rem-title" class="field-label">Pesan Pengingat *</label>
              <input type="text" id="rem-title" class="form-input" required maxlength="255">
            </div>
            <div class="field">
              <label for="rem-time" class="field-label">Waktu Pengingat *</label>
              <input type="datetime-local" id="rem-time" class="form-input" required>
            </div>
            <div class="field">
              <button type="submit" class="btn-primary btn-block">Simpan Pengingat</button>
            </div>
          </div>
        </form>

        <div id="custom-reminders-list" class="list">
          <p class="loading-text">Memuat daftar pengingat…</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Mobile Bottom Nav (< 1024px) -->
  <div id="mobile-bottom-nav"></div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    initNavigation('reminders');

    const CHECK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

    const formEl = document.getElementById('custom-reminder-form');
    const toggleBtn = document.getElementById('toggle-reminder-form');

    function setFormOpen(open) {
      formEl.classList.toggle('hidden', !open);
      toggleBtn.setAttribute('aria-expanded', String(open));
      if (open) document.getElementById('rem-title').focus();
    }
    toggleBtn.addEventListener('click', () => setFormOpen(formEl.classList.contains('hidden')));

    async function loadReminders() {
      try {
        const res = await apiFetch('/api/reminders/urgent');
        if (res && res.data) {
          const overdue = res.data.overdue_tasks || [];
          const urgent = res.data.urgent_tasks || [];

          document.getElementById('badge-overdue-count').textContent = overdue.length;
          document.getElementById('badge-urgent-count').textContent = urgent.length;

          document.getElementById('overdue-list').innerHTML = overdue.length
            ? overdue.map(t => createReminderCard(t, 'overdue')).join('')
            : `<div class="note">${CHECK_SVG}<span>Tidak ada tugas yang lewat tenggat.</span></div>`;

          document.getElementById('urgent-list').innerHTML = urgent.length
            ? urgent.map(t => createReminderCard(t, 'urgent')).join('')
            : `<div class="note">${CHECK_SVG}<span>Tidak ada tugas yang jatuh tempo dalam 24 jam.</span></div>`;
        }

        const customRes = await apiFetch('/api/reminders');
        const customContainer = document.getElementById('custom-reminders-list');
        const items = (customRes && customRes.data) || [];
        customContainer.innerHTML = items.length
          ? items.map(r => `
            <div class="card list-row">
              <div class="list-row-main">
                <p class="list-row-title">${escapeHtml(r.title)}</p>
                <p class="list-row-meta font-mono">${formatDateWIB(r.remind_at)}</p>
              </div>
              <button type="button" onclick="deleteCustomReminder(${Number(r.id)})" class="btn-danger btn-sm" aria-label="Hapus pengingat: ${escapeHtml(r.title)}">Hapus</button>
            </div>`).join('')
          : '<div class="empty-state-box compact">Belum ada pengingat mandiri.</div>';
      } catch (err) {}
    }

    function createReminderCard(task, type) {
      const isOverdue = type === 'overdue';
      const title = escapeHtml(task.title);
      return `
        <div class="card list-row ${isOverdue ? 'tone-overdue' : 'tone-urgent'}">
          <div class="list-row-main">
            <div class="list-row-tags">
              <span class="badge ${isOverdue ? 'badge-overdue' : 'badge-urgent'}">${formatHoursRemaining(task.hours_left)}</span>
              ${categoryBadge(task.category)}
            </div>
            <p class="list-row-title">${title}</p>
            <p class="list-row-meta">Tenggat <span class="font-mono">${formatDateWIB(task.due_date)}</span></p>
          </div>
          <div class="list-row-actions">
            <a href="/tasks" class="btn-secondary btn-sm">Buka di Board</a>
            <button type="button" onclick="completeTaskNow(${Number(task.id)})" class="btn-primary btn-sm" aria-label="Tandai selesai: ${title}">Tandai Selesai</button>
          </div>
        </div>`;
    }

    async function completeTaskNow(taskId) {
      try {
        await apiFetch(`/api/tasks/${taskId}`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'Done' }),
        });
        showToast('Tugas berhasil diselesaikan!', 'success');
        loadReminders();
      } catch (e) {}
    }

    async function deleteCustomReminder(id) {
      try {
        await apiFetch(`/api/reminders/${id}`, { method: 'DELETE' });
        showToast('Pengingat dihapus.', 'info');
        loadReminders();
      } catch (e) {}
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('rem-title').value;
      const remind_at = localInputToISO(document.getElementById('rem-time').value);

      try {
        await apiFetch('/api/reminders', {
          method: 'POST',
          body: JSON.stringify({ title, remind_at }),
        });
        showToast('Pengingat berhasil dijadwalkan!', 'success');
        formEl.reset();
        setDefaultTime();
        setFormOpen(false);
        loadReminders();
      } catch (e) {}
    });

    // Default: 3 jam dari sekarang
    function setDefaultTime() {
      const nowPlus3 = new Date(Date.now() + 3 * 3600000);
      const tzOffset = nowPlus3.getTimezoneOffset() * 60000;
      document.getElementById('rem-time').value = new Date(nowPlus3.getTime() - tzOffset).toISOString().slice(0, 16);
    }
    setDefaultTime();

    loadReminders();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">

  <main class="card auth-card">
    <div class="auth-head">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <div>
          <div class="brand-name">Manajemen Tugas</div>
          <div class="brand-sub">Workspace Tim</div>
        </div>
      </div>
      <h1 class="auth-title">Masuk</h1>
      <p class="page-sub">Masuk untuk mengelola workspace tim Anda.</p>
    </div>

    <!-- Error Alert Box -->
    <div id="error-alert" class="alert-error" role="alert" aria-live="polite" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0; margin-top:1px;">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span id="error-message"></span>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="field">
        <label for="email" class="field-label">Alamat Email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="nama@perusahaan.com" required
          autocomplete="email" spellcheck="false">
      </div>

      <div class="field" style="margin-bottom: 1.5rem;">
        <div class="label-row">
          <label for="password" class="field-label">Kata Sandi</label>
          <button type="button" id="toggle-pwd-btn" class="btn-ghost btn-sm" aria-controls="password"
            aria-pressed="false">Lihat Sandi</button>
        </div>
        <input type="password" id="password" name="password" class="form-input" required
          autocomplete="current-password">
      </div>

      <button type="submit" id="submit-btn" class="btn-primary btn-block">
        <span id="btn-spinner" class="spinner hidden" aria-hidden="true"></span>
        <span id="btn-text">Masuk ke Sistem</span>
      </button>
      <p class="auth-foot"><a href="/forgot-password" class="link-btn">Lupa kata sandi?</a></p>
    </form>

    <!-- 2FA Step -->
    <form id="twofa-form" class="hidden">
      <div class="field" style="margin-bottom: 1.5rem;">
        <label for="twofa-code" class="field-label">Kode verifikasi</label>
        <input type="text" id="twofa-code" class="form-input code-input font-mono" inputmode="numeric"
          autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-describedby="twofa-hint">
        <p id="twofa-hint" class="field-hint">Buka aplikasi authenticator dan masukkan 6 digit untuk Manajemen Tugas.</p>
      </div>
      <button type="submit" id="twofa-btn" class="btn-primary btn-block">Verifikasi</button>
      <button type="button" id="twofa-back" class="link-btn" style="margin-top: 0.5rem;">Kembali ke email &amp; kata sandi</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/pages/login.js"></script>
</body>

</html>

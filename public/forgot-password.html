<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">

  <main class="card auth-card">
    <div class="auth-head">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <div>
          <div class="brand-name">Manajemen Tugas</div>
          <div class="brand-sub">Workspace Tim</div>
        </div>
      </div>
      <h1 class="auth-title">Lupa kata sandi</h1>
      <p class="page-sub">Masukkan email akun Anda. Kami kirim tautan untuk membuat kata sandi baru.</p>
    </div>

    <div id="error-alert" class="alert-error hidden" role="alert"></div>
    <div id="success-alert" class="alert-success hidden" role="status"></div>

    <form id="forgot-form">
      <div class="field" style="margin-bottom: 1.5rem;">
        <label for="email" class="field-label">Alamat Email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="nama@perusahaan.com" required
          maxlength="150" autocomplete="email" spellcheck="false">
      </div>
      <button type="submit" id="submit-btn" class="btn-primary btn-block">Kirim tautan reset</button>
      <p class="field-hint" style="margin-top: 0.75rem;">Tidak bisa menerima email? Owner dapat mengatur ulang kata sandi Anda dari halaman Pengguna.</p>
    </form>
    <p class="auth-foot"><a href="/login" class="link-btn">Kembali ke halaman masuk</a></p>
  </main>

  <script src="/js/pages/forgot-password.js"></script>
</body>

</html>

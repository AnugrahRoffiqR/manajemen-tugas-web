<!DOCTYPE html>
<html lang="id">

<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Atur Ulang Kata Sandi — Sistem Manajemen Tugas</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#faf6f0">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">

  <main class="card auth-card">
    <div class="auth-head">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <div>
          <div class="brand-name">Manajemen Tugas</div>
          <div class="brand-sub">Workspace Tim</div>
        </div>
      </div>
      <h1 class="auth-title">Kata sandi baru</h1>
      <p class="page-sub">Setelah disimpan, semua perangkat yang sedang masuk akan keluar otomatis.</p>
    </div>

    <div id="error-alert" class="alert-error hidden" role="alert"></div>
    <div id="success-alert" class="alert-success hidden" role="status"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password" class="field-label">Kata sandi baru</label>
        <input type="password" id="password" class="form-input" required minlength="8" maxlength="200"
          autocomplete="new-password" aria-describedby="password-hint">
        <p id="password-hint" class="field-hint">Minimal 8 karakter.</p>
      </div>
      <div class="field" style="margin-bottom: 1.5rem;">
        <label for="password-confirm" class="field-label">Ulangi kata sandi baru</label>
        <input type="password" id="password-confirm" class="form-input" required minlength="8" maxlength="200"
          autocomplete="new-password">
      </div>
      <button type="submit" id="submit-btn" class="btn-primary btn-block">Simpan kata sandi</button>
    </form>
    <p class="auth-foot"><a href="/login" id="login-link" class="link-btn">Kembali ke halaman masuk</a></p>
  </main>

  <script src="/js/pages/reset-password.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tugas — Memuat Workspace...</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100dvh;">
  <div style="text-align: center;">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: #3b82f6; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: bold; margin-bottom: 1rem; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);">
      ✓
    </div>
    <h2 style="font-size: 1.125rem; font-weight: 600; color: #f8fafc;">Menghubungkan ke Workspace...</h2>
    <p style="font-size: 0.875rem; color: #64748b; margin-top: 0.25rem;">Memverifikasi sesi pengguna</p>
  </div>

  <script>
    fetch('/api/auth/me')
      .then(res => {
        if (res.ok) {
          window.location.replace('/dashboard');
        } else {
          window.location.replace('/login');
        }
      })
      .catch(() => {
        window.location.replace('/login');
      });
  </script>
</body>
</html>

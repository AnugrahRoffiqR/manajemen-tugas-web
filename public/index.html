<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tugas — Memuat Workspace...</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100dvh;">
  <div style="text-align: center;">
    <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #0080ff, #8b00ff); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: bold; margin-bottom: 1.25rem; box-shadow: 0 8px 24px rgba(0, 128, 255, 0.35);" class="pulse-ring">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
    </div>
    <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text);">Menghubungkan ke Workspace...</h2>
    <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">Memverifikasi sesi pengguna & Neon Cloud</p>
  </div>

  <script>
    fetch('/api/auth/me')
      .then(res => {
        if (res.ok) {
          window.location.replace('/dashboard');
        } else {
          window.location.replace('/login');
        }
      })
      .catch(() => {
        window.location.replace('/login');
      });
  </script>
</body>
</html>
